<style>
:root {
  --cp-blue:#075FDC; --cp-navy:#1E2D4D; --cp-sky:#C6E0F7; --cp-sky-tint:#EDF9FF;
  --cp-white:#FFFFFF; --cp-wheat:#FAF5F0; --cp-wheat-100:#F5EBE0; --cp-black:#161616;
  --cp-storm:#253F70; --cp-success:#12B765; --cp-error:#F04438; --cp-warning:#F7B009;
  --cp-muted:#4F4F4F; --cp-muted-light:#888888;
  --font-headline:'VictorSerif',Georgia,serif;
  --font-body:'StabilGrotesk','Inter',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--cp-wheat);color:var(--cp-black);font-family:var(--font-body);font-size:14px;line-height:1.5;min-height:100vh;}
.page{max-width:1200px;margin:0 auto;padding:48px 32px 100px;}
.page-header{border-bottom:1.5px solid var(--cp-sky);padding-bottom:32px;margin-bottom:0;}
.header-top{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:16px;}
.header-logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:32px;height:32px;background:var(--cp-blue);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.logo-wordmark{font-size:18px;font-weight:700;color:var(--cp-blue);letter-spacing:-0.02em;}
.header-meta{text-align:right;font-size:12px;color:var(--cp-muted-light);line-height:1.6;}
.page-title{font-family:var(--font-headline);font-size:40px;font-weight:400;color:var(--cp-black);letter-spacing:-0.02em;line-height:1;margin-bottom:6px;}
.page-sub{font-size:14px;color:var(--cp-muted);}
.tab-bar{display:flex;gap:0;border-bottom:2px solid var(--cp-sky);margin-bottom:32px;overflow-x:auto;margin-top:0;}
.tab-btn{padding:14px 22px;font-size:13px;font-weight:600;color:var(--cp-muted);background:none;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;cursor:pointer;white-space:nowrap;transition:color .15s,border-color .15s;font-family:var(--font-body);}
.tab-btn:hover{color:var(--cp-blue);}
.tab-btn.active{color:var(--cp-blue);border-bottom-color:var(--cp-blue);}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
.slabel{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--cp-muted-light);margin:32px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--cp-sky);display:flex;align-items:baseline;gap:8px;}
.slabel-note{font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--cp-muted-light);font-style:italic;}
.kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;}
.kpi{background:var(--cp-white);border:1px solid var(--cp-sky);border-top:3px solid var(--cp-blue);border-radius:8px;padding:14px 16px;}
.klbl{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--cp-muted-light);margin-bottom:6px;}
.kval{font-size:26px;font-weight:700;color:var(--cp-black);line-height:1;letter-spacing:-0.02em;}
.kval.up{color:var(--cp-success);}.kval.blue{color:var(--cp-blue);}
.ksub{font-size:11px;color:var(--cp-muted-light);margin-top:3px;}
.kdelta{font-size:11px;font-weight:600;margin-top:3px;}
.kdelta.up{color:var(--cp-success);}.kdelta.down{color:var(--cp-error);}.kdelta.{color:var(--cp-muted-light);}
.card{background:var(--cp-white);border:1px solid var(--cp-sky);border-radius:8px;padding:20px 22px;margin-bottom:8px;}
.ctitle{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cp-muted);margin-bottom:3px;}
.csub{font-size:11px;color:var(--cp-muted-light);font-style:italic;margin-bottom:14px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.br{display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.bl{font-size:11px;color:var(--cp-muted);width:170px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bl-sm{font-size:11px;color:var(--cp-muted);width:130px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bt{flex:1;background:var(--cp-wheat-100);border-radius:3px;height:10px;overflow:hidden;}
.bf{height:100%;border-radius:3px;}
.bv{font-size:11px;color:var(--cp-muted-light);min-width:38px;text-align:right;}
.sen-leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.sen-leg span{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--cp-muted);}
.sen-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.fc{background:var(--cp-wheat);border:1px solid var(--cp-sky);border-radius:6px;padding:10px 14px;margin-bottom:6px;}
.fcn{font-size:13px;font-weight:600;color:var(--cp-black);}
.fct{font-size:11px;color:var(--cp-muted);margin-top:2px;}
.cc{background:var(--cp-white);border:1px solid var(--cp-sky);border-left:4px solid var(--cp-blue);border-radius:8px;padding:20px 22px;margin-bottom:10px;}
.cc.medium{border-left-color:var(--cp-storm);}
.cc.watch{border-left-color:var(--cp-sky);}
.ccname{font-size:15px;font-weight:700;color:var(--cp-black);margin-bottom:2px;}
.ccperson{font-size:11px;color:var(--cp-muted);margin-bottom:10px;}
.ccg{display:grid;grid-template-columns:1fr 1fr;gap:3px 16px;padding:12px 14px;background:var(--cp-wheat);border-radius:6px;}
.ccr{font-size:11px;line-height:1.7;}
.cck{color:var(--cp-muted-light);margin-right:4px;}
.ccv{color:var(--cp-black);}
.company-tiles{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px;}
.ctile{display:flex;align-items:center;gap:12px;background:var(--cp-wheat);border:1px solid var(--cp-sky);border-radius:8px;padding:12px 18px;flex:1;min-width:140px;}
.ctile-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px;font-weight:700;}
.ctile-name{font-size:13px;font-weight:700;color:var(--cp-black);}
.ctile-desc{font-size:10px;color:var(--cp-muted-light);}
.goal-bar-track{background:var(--cp-wheat-100);border-radius:8px;height:20px;overflow:hidden;position:relative;}
.goal-bar-fill{height:100%;background:linear-gradient(90deg,var(--cp-blue),#3A79D6);border-radius:8px;transition:width .8s ease;width:0%;}
.goal-bar-lbl{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;color:var(--cp-muted);}
.goal-milestones{display:flex;justify-content:space-between;margin-top:6px;font-size:10px;color:var(--cp-muted-light);}
.goal-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:14px;}
.gs{background:var(--cp-wheat);border:1px solid var(--cp-sky);border-radius:7px;padding:10px 14px;}
.gs-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--cp-muted-light);margin-bottom:3px;}
.gs-val{font-size:18px;font-weight:700;color:var(--cp-black);}
.gs-val.blue{color:var(--cp-blue);}
.gs-sub{font-size:10px;color:var(--cp-muted-light);}
.wt-table{width:100%;border-collapse:collapse;font-size:12px;}
.wt-table th{text-align:left;padding:6px 12px 8px 0;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cp-muted-light);border-bottom:1.5px solid var(--cp-sky);}
.wt-table th.r,.wt-table td.r{text-align:right;padding:10px 12px;}
.wt-table td{padding:10px 12px 10px 0;border-bottom:1px solid var(--cp-sky);vertical-align:middle;}
.wt-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:6px;display:inline-block;}
.wt-latest{background:var(--cp-blue);color:white;}
.wt-partial{background:var(--cp-warning);color:var(--cp-navy);}
.ad-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:4px;}
.ad-table th{text-align:left;padding:6px 10px 8px 0;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cp-muted-light);border-bottom:1.5px solid var(--cp-sky);}
.ad-table th.r{text-align:right;}
.ad-table td{padding:9px 10px 9px 0;border-bottom:1px solid var(--cp-sky);vertical-align:middle;font-size:12px;color:var(--cp-black);}
.ad-table td.r{text-align:right;padding:9px 10px;}
.ad-table tr:last-child td{border-bottom:none;}
.ad-best{background:rgba(18,183,101,0.06);}
.ad-worst{background:rgba(240,68,56,0.04);}
.budget-bar-track{background:var(--cp-wheat-100);border-radius:6px;height:14px;overflow:hidden;position:relative;margin-top:8px;}
.budget-bar-fill{height:100%;background:linear-gradient(90deg,var(--cp-blue),#3A79D6);border-radius:6px;}
.budget-bar-lbl{position:absolute;right:6px;top:50%;transform:translateY(-50%);font-size:10px;font-weight:700;color:var(--cp-muted);}
.paid-kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-bottom:14px;}
.page-footer{position:fixed;bottom:0;left:0;right:0;background:var(--cp-white);border-top:1px solid var(--cp-sky);padding:12px 32px;display:flex;align-items:center;justify-content:space-between;}
.footer-logo{display:flex;align-items:center;gap:8px;}
.footer-logo-mark{width:20px;height:20px;background:var(--cp-blue);border-radius:4px;display:flex;align-items:center;justify-content:center;}
.footer-logo-text{font-size:13px;font-weight:700;color:var(--cp-blue);}
.footer-text{font-size:11px;color:var(--cp-muted-light);}
@media(max-width:680px){.g2{grid-template-columns:1fr;}.page{padding:32px 16px 100px;}.tab-btn{padding:12px 14px;font-size:12px;}}
</style>
</head>

const tabBar    = document.getElementById('tab-bar');
const tabPanels = document.getElementById('tab-panels');
const chartInst = {};

weeks.forEach((w,wi) => {
  const isLast = wi===weeks.length-1;
  const btn = document.createElement('button');
  btn.className = 'tab-btn'+(isLast?' active':'');
  btn.textContent = w.label+(w.partial?' (partial)':'');
  btn.dataset.tab = w.id;
  btn.onclick = ()=>switchTab(w.id);
  tabBar.appendChild(btn);

  const panel = document.createElement('div');
  panel.id = 'panel-'+w.id;
  panel.className = 'tab-panel'+(isLast?' active':'');
  panel.innerHTML = buildPanel(w);
  tabPanels.appendChild(panel);
});

function switchTab(id){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===id));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));
  initCharts(id);
}

// ═══════════════════════════════════════════
// BUILD PANEL
// ═══════════════════════════════════════════
function buildPanel(w){
  const k=w.kpis;

  const kpi=(label,d,vc='')=>`
    <div class="kpi">
      <div class="klbl">${label}</div>
      <div class="kval ${vc}">${d.val}</div>
      ${d.delta?`<div class="kdelta ${d.deltaDir}">${d.delta}</div>`:`<div class="ksub">${d.sub}</div>`}
    </div>`;

  const bar=(lbl,pw,pLabel,color,lc='bl')=>
    `<div class="br"><span class="${lc}" title="${lbl}">${lbl}</span><div class="bt"><div class="bf" style="width:${pw}%;background:${color};"></div></div><span class="bv">${pLabel}</span></div>`;

  const maxInd=w.industries[0].v;
  const indBars=w.industries.map(d=>bar(d.n,Math.round(d.v/maxInd*100),d.p,CB)).join('');

  const maxFn=w.jobFunctions.filter(d=>d.n!=='Others').reduce((a,b)=>a.v>b.v?a:b).v;
  const fnBars=w.jobFunctions.map(d=>{
    const isO=d.n==='Others';
    return bar(d.n,isO?100:Math.round(d.v/maxFn*100),d.p,isO?CY:CN,'bl-sm');
  }).join('');

  const senLeg=w.seniority.map((d,i)=>
    `<span><span class="sen-dot" style="background:${SEN_C[i]||'#ccc'};"></span>${d.l} ${d.p}</span>`).join('');

  const tiles=w.searcherCompanies.map(c=>`
    <div class="ctile" ${c.highlight?'style="border-color:var(--cp-blue);"':''}>
      <div class="ctile-av" style="background:${c.bg};color:${c.color};">${c.name[0]}</div>
      <div>
        <div class="ctile-name" ${c.highlight?'style="color:var(--cp-blue);"':''}>${c.name}</div>
        <div class="ctile-desc">${c.desc}</div>
      </div>
    </div>`).join('');

  const followers=w.notableFollowers.length>0
    ? w.notableFollowers.map(f=>`<div class="fc"><div class="fcn">${f.name}</div><div class="fct">${f.title}</div></div>`).join('')
    : '<div style="font-size:12px;color:var(--cp-muted-light);font-style:italic;padding:8px 0;">No notable travel or aviation followers identified this week.</div>';

  const companies=w.companies.map(c=>`
    <div class="cc ${c.style}">
      <div class="ccname">${c.name}</div>
      <div class="ccperson">${c.person}</div>
      <div class="ccg">${c.details.map(([k,v])=>`<div class="ccr"><span class="cck">${k}</span><span class="ccv">${v}</span></div>`).join('')}</div>
    </div>`).join('');

  const pct=Math.min(100,(CURRENT_FOLLOWERS/TARGET*100)).toFixed(1);
  const today=new Date();
  const wl=Math.max(0,Math.ceil((Q2_END-today)/(7*24*60*60*1000)));
  const needed=TARGET-CURRENT_FOLLOWERS;
  const npw=wl>0?Math.ceil(needed/wl):'—';

  const Q2_START_FOLLOWERS = 2683;
  const Q2_INCREMENTAL_TARGET = 317;
  const trackerRows=weeklyTracker.map((r,i)=>{
    const q2gained = r.total - Q2_START_FOLLOWERS;
    const rp=Math.min(100,(q2gained/Q2_INCREMENTAL_TARGET*100)).toFixed(1);
    const isL=i===weeklyTracker.length-1;
    const gc=r.gained>0?'color:var(--cp-success);':'color:var(--cp-muted-light);';
    return `<tr style="${isL?'background:var(--cp-sky-tint);':''}">
      <td style="font-weight:${isL?'600':'400'};color:var(--cp-black);">
        ${r.label}
        ${isL?'<span class="wt-badge wt-latest">Latest</span>':''}
        ${r.partial?'<span class="wt-badge wt-partial">Partial week</span>':''}
      </td>
      <td class="r" style="font-weight:700;font-size:14px;${gc}">+${r.gained}</td>
      <td class="r" style="font-weight:${isL?'600':'400'};">${r.total.toLocaleString()}</td>
      <td style="padding:10px 0 10px 12px;width:38%;">
        <div style="display:flex;align-items:center;gap:8px;">
          <div style="flex:1;background:var(--cp-wheat-100);border-radius:4px;height:8px;overflow:hidden;">
            <div style="width:${rp}%;height:100%;background:linear-gradient(90deg,#075FDC,#3A79D6);border-radius:4px;"></div>
          </div>
          <span style="font-size:10px;color:var(--cp-muted-light);min-width:34px;text-align:right;">${rp}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  return `
    <div class="slabel">${w.label} performance</div>
    <div class="kgrid">
      ${kpi('Page Views',k.pageViews,'blue')}
      ${kpi('Unique Visitors',k.uniqueVisitors,'blue')}
      ${kpi('New Followers',k.newFollowers,'up')}
      ${kpi('Visitor → Follow',k.visitorFollow,'up')}
      ${kpi('Page Searches',k.pageSearches,'blue')}
      ${kpi('Total Followers',k.totalFollowers,'')}
      ${kpi('Total Posts',k.totalPosts,'blue')}
      ${kpi('Engagement Rate',k.engagementRate,'up')}
      ${kpi('Engagement Metrics',k.engagementMetrics,'up')}
    </div>

    <div class="slabel">Q2 follower goal</div>
    <div class="card">
      ${(()=>{
        const Q2_START = 2683;
        const Q2_TARGET_INCREMENTAL = 317; // 3000 - 2683
        const weekTotal = parseInt(w.kpis.totalFollowers.val.replace(',',''));
        const q2Gained = weekTotal - Q2_START;
        const q2Remaining = Math.max(0, Q2_TARGET_INCREMENTAL - q2Gained);
        const q2Pct = Math.min(100, (q2Gained / Q2_TARGET_INCREMENTAL * 100)).toFixed(1);
        const today = new Date();
        const wl = Math.max(0, Math.ceil((Q2_END - today) / (7*24*60*60*1000)));
        const npw = wl > 0 ? Math.ceil(q2Remaining / wl) : '—';
        const milestones = [0, Math.round(Q2_TARGET_INCREMENTAL*0.25), Math.round(Q2_TARGET_INCREMENTAL*0.5), Math.round(Q2_TARGET_INCREMENTAL*0.75), Q2_TARGET_INCREMENTAL];
        return `
        <div class="ctitle">Target: 3,000 followers by end of Q2</div>
        <div style="font-size:11px;color:var(--cp-muted-light);margin-top:3px;margin-bottom:14px;">
          Q2 requires <strong style="color:var(--cp-black);">317 new followers</strong> (Apr 1–Jun 30) to hit 3,000 —
          <strong style="color:var(--cp-blue);">+22% more incremental growth</strong> than Q1, which added 260 new followers.
        </div>
        <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px;flex-wrap:wrap;gap:8px;">
          <div>
            <div style="font-size:11px;color:var(--cp-muted-light);">Q2 new followers gained as of ${w.label}</div>
            <div style="font-size:28px;font-weight:700;color:var(--cp-blue);letter-spacing:-0.02em;line-height:1.1;">${q2Gained} <span style="font-size:14px;color:var(--cp-muted-light);font-weight:400;">of ${Q2_TARGET_INCREMENTAL} needed</span></div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:11px;color:var(--cp-muted-light);">Total followers — ${w.label}</div>
            <div style="font-size:22px;font-weight:700;color:var(--cp-black);letter-spacing:-0.02em;line-height:1.1;">${weekTotal.toLocaleString()}</div>
            <div style="font-size:11px;color:var(--cp-error);font-weight:600;margin-top:1px;">${q2Remaining} still needed to reach 3,000</div>
          </div>
        </div>
        <div style="margin-bottom:4px;display:flex;justify-content:space-between;font-size:10px;color:var(--cp-muted-light);">
          <span>Q2 start: 2,683</span><span>${Q2_TARGET_INCREMENTAL} new followers needed</span>
        </div>
        <div class="goal-bar-track">
          <div class="goal-bar-fill" id="gb-${w.id}" style="width:0%;"></div>
          <div class="goal-bar-lbl">${Q2_TARGET_INCREMENTAL}</div>
        </div>
        <div class="goal-milestones">${milestones.map(m=>`<span>${m}</span>`).join('')}</div>
        <div class="goal-stats">
          <div class="gs"><div class="gs-lbl">Q2 progress</div><div class="gs-val blue" id="q2pct-${w.id}">${q2Pct}%</div><div class="gs-sub">of Q2 incremental goal</div></div>
          <div class="gs"><div class="gs-lbl">Q2 gained</div><div class="gs-val">${q2Gained}</div><div class="gs-sub">new followers in Q2</div></div>
          <div class="gs"><div class="gs-lbl">Still needed</div><div class="gs-val">${q2Remaining}</div><div class="gs-sub">to reach 3,000</div></div>
          <div class="gs"><div class="gs-lbl">Weeks left in Q2</div><div class="gs-val">${wl}</div><div class="gs-sub">until Jun 30</div></div>
          <div class="gs"><div class="gs-lbl">Needed / week</div><div class="gs-val">${npw}</div><div class="gs-sub">avg new followers</div></div>
          <div class="gs"><div class="gs-lbl">vs Q1 growth</div><div class="gs-val" style="color:var(--cp-error);">+22%</div><div class="gs-sub">more growth required</div></div>
        </div>`;
      })()}
    </div>

    <div class="slabel">Top page searcher demographics <span class="slabel-note">— no date range available</span></div>
    <div class="card">
      <div class="ctitle">Top companies searching your page</div>
      <div class="csub">No date range available for this data</div>
      <div class="company-tiles">${tiles}</div>
      ${w.searcherJobTitles && w.searcherJobTitles.length ? `
      <div style="margin-top:16px;">
        <div class="ctitle" style="margin-bottom:10px;">Top searcher job titles</div>
        ${w.searcherJobTitles.map(d=>`<div class="br"><span class="bl" title="${d.n}">${d.n}</span><div class="bt"><div class="bf" style="width:${Math.round(parseFloat(d.p)/parseFloat(w.searcherJobTitles[0].p)*100)}%;background:${CN};"></div></div><span class="bv">${d.p}</span></div>`).join('')}
      </div>` : ''}
      ${w.searcherIndustries && w.searcherIndustries.length ? `
      <div style="margin-top:16px;">
        <div class="ctitle" style="margin-bottom:10px;">Top searcher industries</div>
        ${w.searcherIndustries.map(d=>`<div class="br"><span class="bl" title="${d.n}">${d.n}</span><div class="bt"><div class="bf" style="width:${Math.round(d.v/w.searcherIndustries[0].v*100)}%;background:${CB};"></div></div><span class="bv">${d.p}</span></div>`).join('')}
      </div>` : ''}
    </div>

    <div class="slabel">Visitor demographics <span class="slabel-note">— ${w.label}</span></div>
    <div class="g2" style="margin-bottom:10px;">
      <div class="card">
        <div class="ctitle">Top industries</div>
        <div class="csub">${w.label} · visitor data</div>
        ${indBars}
      </div>
      <div class="card">
        <div class="ctitle">Visitor job functions</div>
        <div class="csub">${w.label} · visitor data</div>
        ${fnBars}
      </div>
    </div>
    <div class="card" style="margin-bottom:10px;">
      <div class="ctitle">Seniority breakdown</div>
      <div class="csub">${w.label} · visitor data</div>
      <div style="position:relative;height:220px;"><canvas id="sen-${w.id}" role="img" aria-label="Seniority for ${w.label}."></canvas></div>
      <div class="sen-leg">${senLeg}</div>
    </div>

    ${w.showFollowers===false ? '' : `
    <div class="slabel">Travel &amp; aviation follower spotlight</div>
    <div class="card">
      <div class="ctitle">Notable travel &amp; aviation followers — ${w.label}</div>
      <div style="margin-top:12px;">${followers}</div>
    </div>`}

    ${w.showCompanies===false ? '' : `
    <div class="slabel">Company deep dives</div>
    ${companies}`}

    ${w.featuredPost ? (() => {
      const fp = w.featuredPost;
      const m = fp.metrics;
      return `
    <div class="slabel">Featured post <span class="slabel-note">— ${w.label}</span></div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
        <div>
          <div class="ctitle">${fp.title}</div>
          <div class="csub" style="margin-bottom:0;">${fp.type} post</div>
        </div>
        <a href="${fp.url}" target="_blank" style="display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--cp-blue);text-decoration:none;padding:6px 14px;border:1.5px solid var(--cp-blue);border-radius:6px;white-space:nowrap;">↗ View post on LinkedIn</a>
      </div>
      <div class="paid-kgrid">
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Impressions</div>
          <div class="kval blue">${m.impressions.toLocaleString()}</div>
          <div class="ksub">total</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Members reached</div>
          <div class="kval">${m.membersReached.toLocaleString()}</div>
          <div class="ksub">unique</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Engagement</div>
          <div class="kval">${m.engagement.toLocaleString()}</div>
          <div class="ksub">total actions</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Engagement rate</div>
          <div class="kval up">${m.engagementRate}</div>
          <div class="ksub">impressions</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Clicks</div>
          <div class="kval">${m.clicks}</div>
          <div class="ksub">total</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">CTR</div>
          <div class="kval up">${m.ctr}</div>
          <div class="ksub">click-through rate</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Page viewers</div>
          <div class="kval">${m.pageViewers}</div>
          <div class="ksub">from this post</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-blue);">
          <div class="klbl">Followers gained</div>
          <div class="kval up">+${m.followersGained}</div>
          <div class="ksub">from this post</div>
        </div>
      </div>
    </div>`;
    })() : ''}

    ${w.paidAds ? (() => {
      const pa = w.paidAds;
      const budgetPct = (parseFloat(pa.spent.replace('$','')) / parseFloat(pa.budget.replace('$','').replace(',','')) * 100).toFixed(1);
      const bestCTR = [...pa.ads].sort((a,b)=>parseFloat(b.ctr)-parseFloat(a.ctr))[0].name;
      const worstCTR = [...pa.ads].filter(a=>parseFloat(a.ctr)>0).sort((a,b)=>parseFloat(a.ctr)-parseFloat(b.ctr))[0]?.name;
      const bestDwell = [...pa.ads].sort((a,b)=>parseFloat(b.dwellTime)-parseFloat(a.dwellTime))[0]?.name;

      // Benchmarks by format (ZenABM 2026 report, 161,256 ads across 211 companies)
      const TLA_CTR_BENCH = 2.68, TLA_ER_BENCH = 10.0;
      const BRAND_CTR_BENCH = 0.42, BRAND_ER_BENCH = 1.5;
      const isTLA = name => name.includes('Thought Leadership');

      const vsTag = (val, bench) => {
        const diff = ((val - bench) / bench * 100).toFixed(0);
        const pct = parseFloat(val);
        if(pct === 0) return '<span style="font-size:10px;background:rgba(240,68,56,0.12);color:#F04438;padding:1px 5px;border-radius:8px;font-weight:700;">Below</span>';
        if(val >= bench) return `<span style="font-size:10px;background:rgba(18,183,101,0.12);color:#12B765;padding:1px 5px;border-radius:8px;font-weight:700;">+${diff}%</span>`;
        return `<span style="font-size:10px;background:rgba(240,68,56,0.12);color:#F04438;padding:1px 5px;border-radius:8px;font-weight:700;">${diff}%</span>`;
      };

      const adRows = pa.ads.map(a => {
        const tla = isTLA(a.name);
        const ctrBench = tla ? TLA_CTR_BENCH : BRAND_CTR_BENCH;
        const erBench  = tla ? TLA_ER_BENCH  : BRAND_ER_BENCH;
        const isBestDwell = a.name===bestDwell;
        const pausedBadge = a.paused ? '<span style="font-size:10px;background:rgba(247,176,9,0.15);color:#92400E;padding:1px 6px;border-radius:10px;margin-left:6px;font-weight:700;">Paused</span>' : '';
        const nameCell = a.postUrl
          ? `${a.name}${pausedBadge} <a href="${a.postUrl}" target="_blank" style="display:inline-flex;align-items:center;gap:3px;font-size:10px;color:var(--cp-blue);font-weight:600;text-decoration:none;margin-left:6px;padding:1px 6px;border:1px solid var(--cp-sky);border-radius:10px;" title="View post on LinkedIn">↗ View post</a>`
          : `${a.name}${pausedBadge}`;
        const benchLabel = `<span style="font-size:10px;color:var(--cp-muted-light);margin-left:4px;">[${tla?'TLA':'Brand'}]</span>`;
        const dwellVal = a.dwellTime
          ? `${a.dwellTime}${isBestDwell ? ' <span style="font-size:10px;background:rgba(18,183,101,0.15);color:#12B765;padding:1px 5px;border-radius:8px;font-weight:700;">↑ Best</span>' : ''}`
          : '—';
        return `<tr>
          <td style="font-weight:500;">${nameCell}${benchLabel}</td>
          <td class="r">${a.impressions.toLocaleString()}</td>
          <td class="r">${a.clicks}</td>
          <td class="r" style="white-space:nowrap;">${a.ctr} ${vsTag(parseFloat(a.ctr), ctrBench)}</td>
          <td class="r" style="white-space:nowrap;">${a.er} ${vsTag(parseFloat(a.er), erBench)}</td>
          <td class="r">${a.spent}</td>
          <td class="r">${dwellVal}</td>
        </tr>`;
      }).join('');

      return `
    <div class="slabel">Paid ads insights <span class="slabel-note">— ${pa.period}</span></div>
    <div class="card">
      <div class="ctitle">${pa.campaign}</div>
      <div class="csub">Objective: ${pa.objective} · Cost type: ${pa.costType} · Budget: ${pa.budget}</div>
      <div class="paid-kgrid">
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Total spent</div>
          <div class="kval blue">${pa.spent}</div>
          <div class="ksub">campaign to date</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Impressions</div>
          <div class="kval">${pa.totals.impressions.toLocaleString()}</div>
          <div class="ksub">total</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Clicks</div>
          <div class="kval">${pa.totals.clicks}</div>
          <div class="ksub">total</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Overall CTR</div>
          <div class="kval">${pa.totals.ctr}</div>
          <div class="ksub">all ads</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Engagement rate</div>
          <div class="kval">${pa.totals.er}</div>
          <div class="ksub">all ads</div>
        </div>
        <div class="kpi" style="border-top-color:var(--cp-navy);">
          <div class="klbl">Engagements</div>
          <div class="kval">${pa.totals.engagements}</div>
          <div class="ksub">total</div>
        </div>
      </div>
      <div style="margin-bottom:6px;">
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--cp-muted-light);margin-bottom:4px;">
          <span>Budget pacing</span><span>${pa.spent} of ${pa.budget} spent</span>
        </div>
        <div class="budget-bar-track">
          <div class="budget-bar-fill" style="width:${budgetPct}%;"></div>
          <div class="budget-bar-lbl">${pa.budget}</div>
        </div>
      </div>
      <div style="margin-top:16px;">
        <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px;">
          <div style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--cp-muted);">2026 benchmarks</div>
          <span style="font-size:11px;color:var(--cp-muted-light);">TLA: CTR ${TLA_CTR_BENCH}% · ER ${TLA_ER_BENCH}%</span>
          <span style="font-size:11px;color:var(--cp-muted-light);">Brand sponsored: CTR ${BRAND_CTR_BENCH}% · ER ${BRAND_ER_BENCH}%</span>
          <span style="font-size:10px;color:var(--cp-muted-light);font-style:italic;">Source: ZenABM 2026 — 161,256 ads, 211 companies</span>
        </div>
        <div style="overflow-x:auto;">
          <table class="ad-table">
            <thead><tr>
              <th>Ad creative</th>
              <th class="r">Impressions</th>
              <th class="r">Clicks</th>
              <th class="r">CTR vs benchmark</th>
              <th class="r">ER vs benchmark</th>
              <th class="r">Spent</th>
              <th class="r">Dwell time</th>
            </tr></thead>
            <tbody>${adRows}</tbody>
          </table>
        </div>
      </div>
      <div style="margin-top:12px;padding:10px 14px;background:var(--cp-sky-tint);border-left:3px solid var(--cp-blue);border-radius:0 6px 6px 0;font-size:11px;color:var(--cp-muted);line-height:1.7;">
        <strong style="color:var(--cp-blue);">Key observations:</strong> The campaign has now fully spent its $1,500 budget across 6,667 impressions and 77 clicks. Chris Amenechi Thought Leadership leads overall with 2,774 impressions, 39 clicks, 1.41% CTR and 5.52s dwell time — receiving the largest share of budget at $661.99. Adrian Brown Thought Leadership follows closely at 1.21% CTR and 5.53s dwell time. Both thought leadership formats significantly outperform the 0.42% brand benchmark. Brand Handle – Chris Copy remains paused. Dwell time has no published industry benchmark — figures are internal baselines only.
      </div>
    </div>`;
    })() : ''}

    <div class="slabel">Weekly follower tracker <span class="slabel-note">— Q2 2026 progress to 3,000</span></div>
    <div class="card">
      <div class="ctitle">New followers gained per week</div>
      <div class="csub">Updated every Monday</div>
      <div style="overflow-x:auto;margin-top:4px;">
        <table class="wt-table">
          <thead><tr>
            <th>Week</th><th class="r">New followers</th><th class="r">Total</th>
            <th style="padding-left:12px;">Progress to 3,000</th>
          </tr></thead>
          <tbody>${trackerRows}</tbody>
        </table>
      </div>
      <div style="margin-top:12px;padding-top:10px;border-top:1px solid var(--cp-sky);font-size:11px;color:var(--cp-muted-light);">Rows added each Monday as new weekly data becomes available.</div>
    </div>
  `;
}

// ═══════════════════════════════════════════
// CHARTS
// ═══════════════════════════════════════════
function initCharts(wId){
  const w=weeks.find(x=>x.id===wId);
  if(!w) return;
  if(chartInst[wId]){chartInst[wId].destroy();delete chartInst[wId];}

  const canvas=document.getElementById('sen-'+wId);
  if(canvas){
    chartInst[wId]=new Chart(canvas,{
      type:'doughnut',
      data:{labels:w.seniority.map(d=>d.l),datasets:[{data:w.seniority.map(d=>d.v),backgroundColor:SEN_C,borderWidth:2,borderColor:'#FAF5F0'}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:'65%',plugins:{legend:{display:false}}}
    });
  }
  setTimeout(()=>{
    const bar=document.getElementById('gb-'+wId);
    if(bar){
      const Q2_START=2683, Q2_INC=317;
      const weekTotal=parseInt(w.kpis.totalFollowers.val.replace(',',''));
      const q2Pct=Math.min(100,((weekTotal-Q2_START)/Q2_INC*100)).toFixed(1);
      bar.style.width=q2Pct+'%';
    }
  },100);
}

// Init last (active) tab
initCharts(weeks[weeks.length-1].id);
</script>
</body>
</html>
